<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet"
        href="style.css">
    </head>

    <body>

          <div class="calculator">
        
          <div class="top-bar">

              <h1>Calculator</h1>

          <div class="top-icons">
              <button id="themeBtn">🌙</button>

              <button id="menuBtn"
            class="menu-btn">&#8942;</button>

            <div id="menu" class="menu">

               <button id="historyBtn">📜History</button>
               <button id="clearHistory">🗑️ClearHistory</button>

               <ul id="historyList"></ul>
           </div>

            </div>
          </div>
        
               <input type="text" id="display"
            placeholder="0" readonly>

          <div class="buttons">     

               <button class="clear">C</button>
               <button class="delete">⌫</button>
               <button class="operator">%</button>
               <button class="operator">÷</button>
               
               <button>7</button>
               <button>8</button>
               <button>9</button>
               <button class="operator">×</button>


               <button>4</button>
               <button>5</button>
               <button>6</button>
               <button class="operator">-</button>
                
               <button>1</button>
               <button>2</button>
               <button>3</button>
               <button class="operator">+</button>

               <button class="zero">0</button>
               <button>00</button>
               <button>.</button>
               <button class="operator equal">=</button>
               
            </div>

                
        </div>


        <script src="script.js"></script>
    </body>
</html>
